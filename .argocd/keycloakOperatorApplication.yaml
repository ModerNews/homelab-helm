apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-operator
  namespace: argocd
  annotations:
    # Owns the CRDs, so it must land before the keycloak chart that uses them.
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Upstream kustomize, consumed directly - there is no official Helm chart for
    # the operator, and wrapping the manifests locally would only add drift.
    #
    # `cluster-wide` rather than `kubernetes`: the KeycloakOIDCClient CRs live in
    # each app's own namespace, and the namespace-scoped variant only watches the
    # namespace it is installed into.
    repoURL: https://github.com/keycloak/keycloak-k8s-resources
    targetRevision: "26.7.0"
    path: kubernetes/cluster-wide
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
