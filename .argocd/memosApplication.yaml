apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memos
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # The upstream memos chart is published only as a git repo - there is no Helm
    # repository behind it, so it cannot be a `dependencies:` entry the way
    # immich/paperless/arr-stack wrap theirs.
    - repoURL: https://github.com/usememos/helm.git
      targetRevision: HEAD
      path: .
      helm:
        releaseName: memos
        valueFiles:
          - $values/memos/values.yaml
    # Consequently the Keycloak client this repo owns needs its own local chart
    # rather than a templates/ directory inside the upstream one.
    - repoURL: https://github.com/ModerNews/homelab-helm.git
      targetRevision: HEAD
      path: memos
      helm:
        releaseName: memos-oidc
    - repoURL: https://github.com/ModerNews/homelab-helm.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: memos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
