apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd
  annotations:
    # After Vault, before any app declaring a VaultStaticSecret - the CRDs ship with
    # this chart.
    argocd.argoproj.io/sync-wave: "-11"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ModerNews/homelab-helm.git
    targetRevision: HEAD
    path: vault-secrets-operator
    helm:
      releaseName: vault-secrets-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
