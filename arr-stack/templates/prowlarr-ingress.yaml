apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Prowlarr
    gethomepage.dev/group: Indexers
    gethomepage.dev/icon: prowlarr.png
    gethomepage.dev/description: Indexers
    gethomepage.dev/pod-selector: io.kompose.service=prowlarr
    gethomepage.dev/weight: "10"
    gethomepage.dev/widget.type: prowlarr
    gethomepage.dev/widget.url: http://prowlarr.arr-stack.svc.cluster.local:9696
    gethomepage.dev/widget.key: {{ "{{HOMEPAGE_VAR_PROWLARR_KEY}}" | quote }}
    gethomepage.dev/widget.fields: '["numberOfGrabs", "numberOfQueries", "numberOfFailGrabs", "numberOfFailQueries"]'
    kompose.cmd: kompose convert -f docker-compose.yml
    kompose.image-pull-policy: Always
    kompose.service.expose: prowlarr.bay.gruzin.eu
    kompose.service.expose.ingress-class-name: traefik
    kompose.service.expose.tls-secret: prowlarr-tls
    kompose.version: 1.38.0 (HEAD)
    kompose.volume.type: hostPath
    kuma.prowlarr.http.accepted_statuscodes: '["200-299"]'
    kuma.prowlarr.http.name: Prowlarr Indexer
    kuma.prowlarr.http.url: https://prowlarr.bay.gruzin.eu
  labels:
    io.kompose.service: prowlarr
  name: prowlarr
spec:
  ingressClassName: traefik
  rules:
    - host: prowlarr.bay.gruzin.eu
      http:
        paths:
          - backend:
              service:
                name: prowlarr
                port:
                  number: 9696
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - prowlarr.bay.gruzin.eu
      secretName: prowlarr-tls
