{{- with .Values.recyclarr }}
{{- if .enabled }}
{{- /*
Sync-wave ordering for this chart, and why it is not the obvious one.

  -3 / -2   VaultConnection, VaultAuth   (vault-auth.yaml)
   0        the *arr apps themselves     (app-template subcharts, default wave)
   1        recyclarr's API-key secrets  (below)
   2        recyclarr ConfigMap + CronJob
   3        homepage's secrets           (homepage-secrets.yaml)

Secrets deliberately come AFTER the apps, not before. Every key here is minted
BY an *arr instance on first run - so gating the apps on secrets that only exist
once the apps have started is circular, and it deadlocks a fresh install: the
app cannot boot because the secret is missing, and the secret cannot exist until
the app boots. Putting the apps at wave 0 breaks the cycle - they come up, mint
their keys, and the later waves pick them up.

Nothing in wave 0 consumes any of these Secrets; only recyclarr (wave 2) and
homepage (a separate chart, wave 3) do. Do not move secrets back ahead of the
apps.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  recyclarr.yml: |
    {{- range $app, $instances := .config }}
    {{ $app }}:
      {{- range $name, $inst := $instances }}
      {{ $name }}:
        base_url: {{ $inst.base_url }}
        api_key: !env_var {{ $inst.api_key_env }}
{{ toYaml (omit $inst "base_url" "api_key_env") | indent 8 }}
      {{- end }}
    {{- end }}
# One resource per key: VaultStaticSecret reads a single KV path and each
# instance's key lives under its own.
{{- range $env, $path := .vault.keys }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: recyclarr-{{ $env | lower | replace "_" "-" }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: {{ $.Values.vault.name }}
  type: kv-v2
  mount: {{ $.Values.recyclarr.vault.mount | quote }}
  path: {{ $path | quote }}
  refreshAfter: {{ $.Values.recyclarr.vault.refreshAfter | quote }}
  destination:
    name: recyclarr-{{ $env | lower | replace "_" "-" }}
    create: true
    transformation:
      excludeRaw: true
      templates:
        {{ $env }}:
          text: '{{ printf "{{ .Secrets.api_key }}" }}'
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: {{ .schedule | quote }}
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: recyclarr
              image: "{{ .image.repository }}:{{ .image.tag }}"
              args: ["sync"]
              env:
                - name: TZ
                  value: Europe/Warsaw
              envFrom:
                {{- range $env, $path := $.Values.recyclarr.vault.keys }}
                - secretRef:
                    name: recyclarr-{{ $env | lower | replace "_" "-" }}
                {{- end }}
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                # /config stays writable: recyclarr clones the guides repo into it.
                - name: config
                  mountPath: /config
                - name: config-file
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
                  readOnly: true
          volumes:
            - name: config
              hostPath:
                path: /mnt/hdd/media/configs/recyclarr
                type: DirectoryOrCreate
            - name: config-file
              configMap:
                name: recyclarr-config
{{- end }}
{{- end }}
