# Converge-and-exit tool, so it runs as a CronJob. Keys come from Vault and are
# referenced with !env_var, which needs each instance's API key pre-seeded.
recyclarr:
  enabled: true
  image:
    repository: ghcr.io/recyclarr/recyclarr
    tag: "8.7.2"
  schedule: "0 4 * * *"
  vault:
    vaultAuthRef: arr-stack
    mount: secret
    refreshAfter: 1h
    keys:
      SONARR_MAIN_API_KEY: sonarr/recyclarr
      SONARR_ANIME_API_KEY: sonarr-anime/recyclarr
      RADARR_MAIN_API_KEY: radarr/recyclarr
  # Verify template names against `recyclarr list templates` for the pinned image.
  config:
    sonarr:
      main:
        base_url: http://sonarr.arr-stack.svc.cluster.local:8989
        api_key_env: SONARR_MAIN_API_KEY
        include:
          - sonarr-quality-definition-series
          - sonarr-v4-quality-profile-web-1080p
          - sonarr-v4-custom-formats-web-1080p
      anime:
        base_url: http://sonarr-anime.arr-stack.svc.cluster.local:8989
        api_key_env: SONARR_ANIME_API_KEY
        include:
          - sonarr-quality-definition-anime
          - sonarr-v4-quality-profile-anime
          - sonarr-v4-custom-formats-anime
    radarr:
      main:
        base_url: http://radarr.arr-stack.svc.cluster.local:7878
        api_key_env: RADARR_MAIN_API_KEY
        include:
          - radarr-quality-definition-movie
          - radarr-v5-quality-profile-hd-bluray-web
          - radarr-v5-custom-formats-hd-bluray-web

jellyseerrOidc:
  enabled: true
  clientId: jellyseerr
  displayName: Jellyseerr
  keycloakCRName: keycloak
  # Rendered into the keycloak namespace: the operator resolves keycloakCRName
  # only within the client's own namespace.
  keycloakNamespace: keycloak
  realm: homelab
  # Credential source. VSO reads this KV entry and writes Secret/oidc-jellyseerr into
  # this namespace; the entry holds a single `client_secret` key.
  vault:
    address: http://transit-vault.transit-vault.svc.cluster.local:8200
    mount: secret
    path: oidc/jellyseerr
    refreshAfter: 1h
  redirectUris:
    - https://jellyseerr.gruzin.eu/login?provider=keycloak&callback=true

jellyfin:
  image:
    pullPolicy: Always

  deploymentStrategy:
    type: Recreate

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000

  # uid 1000 needs the host render group to open /dev/dri for VAAPI.
  # gid 105 is render on this Fedora node; verify with getent group render.
  podSecurityContext:
    supplementalGroups: [105]

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi

  persistence:
    config:
      enabled: true
      existingClaim: jellyfin-config
    media:
      enabled: false
    cache:
      enabled: true
      type: hostPath
      hostPath: /mnt/hdd/media/configs/jellyfin/cache

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: Jellyfin
      gethomepage.dev/group: Streaming
      gethomepage.dev/icon: jellyfin.png
      gethomepage.dev/pod-selector: app.kubernetes.io/name=jellyfin
      gethomepage.dev/weight: "10"
      gethomepage.dev/widget.type: jellyfin
      gethomepage.dev/widget.url: http://arr-stack-jellyfin.arr-stack.svc.cluster.local:8096
      gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
      gethomepage.dev/widget.version: "2"
      gethomepage.dev/widget.enableNowPlaying: "true"
      gethomepage.dev/widget.expandOneStreamToTwoRows: "false"
    hosts:
      - host: jellyfin.gruzin.eu
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: jellyfin-tls
        hosts:
          - jellyfin.gruzin.eu

  volumes:
    - name: tv
      hostPath:
        path: /mnt/hdd/media/contents/tvseries
    - name: movies
      hostPath:
        path: /mnt/hdd/media/contents/movies
    - name: anime
      hostPath:
        path: /mnt/hdd/media/contents/anime
    - name: fonts
      hostPath:
        path: /mnt/hdd/media/configs/jellyfin/fonts
    # Single-node cluster, so a hostPath device is safe. Transcoding also needs
    # HardwareAccelerationType set in encoding.xml via the Jellyfin UI.
    - name: dri
      hostPath:
        path: /dev/dri

  volumeMounts:
    - name: tv
      mountPath: /tv
    - name: movies
      mountPath: /movies
    - name: anime
      mountPath: /anime
    - name: fonts
      mountPath: /usr/local/share/fonts/custom
      readOnly: true
    - name: dri
      mountPath: /dev/dri

homepageSecrets:
  enabled: true
  namespace: homepage
  vaultAuthRef: homepage
  mount: secret
  refreshAfter: 1h
  apps:
    - name: homepage-jellyfin
      path: jellyfin/homepage
      env:
        HOMEPAGE_VAR_JELLYFIN_KEY: api_key
    - name: homepage-sonarr
      path: sonarr/homepage
      env:
        HOMEPAGE_VAR_SONARR_KEY: api_key
    - name: homepage-sonarr-anime
      path: sonarr-anime/homepage
      env:
        HOMEPAGE_VAR_SONARR_ANIME_KEY: api_key
    - name: homepage-radarr
      path: radarr/homepage
      env:
        HOMEPAGE_VAR_RADARR_KEY: api_key
    - name: homepage-bazarr
      path: bazarr/homepage
      env:
        HOMEPAGE_VAR_BAZARR_KEY: api_key
    - name: homepage-prowlarr
      path: prowlarr/homepage
      env:
        HOMEPAGE_VAR_PROWLARR_KEY: api_key
    - name: homepage-jellyseerr
      path: jellyseerr/homepage
      env:
        HOMEPAGE_VAR_JELLYSEERR_KEY: api_key
    - name: homepage-qbittorrent
      path: qbittorrent/homepage
      env:
        HOMEPAGE_VAR_QBITTORRENT_USERNAME: username
        HOMEPAGE_VAR_QBITTORRENT_PASSWORD: password
