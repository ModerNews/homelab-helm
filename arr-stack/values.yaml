# Second Bazarr, dedicated to sonarr-anime. Bazarr connects to exactly ONE Sonarr
# (its settings model `sonarr` as a single object, not a list), so covering both
# sonarr and sonarr-anime needs two instances - there is no multi-instance mode.
#
# Split of responsibilities:
#   bazarr        -> sonarr (series) + radarr (movies), OpenSubtitles
#   bazarr-anime  -> sonarr-anime only, animesub.info (ANSI) + AniDB matching
#
# Providers are global PER INSTANCE (`general.enabled_providers`), which is the
# real reason this split works: ANSI belongs only on the anime side.
bazarr-anime:
  global:
    # Both overrides are required. fullnameOverride alone names the resources but
    # leaves app.kubernetes.io/name defaulting to the parent chart, so every
    # app-template instance renders an IDENTICAL selector and the Deployments
    # fight over each other's pods. See the sibling entries.
    fullnameOverride: bazarr-anime
    nameOverride: bazarr-anime
  controllers:
    main:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: lscr.io/linuxserver/bazarr
            tag: "v1.6.1-ls364"
            pullPolicy: Always
          env: *arrEnv
          resources: *arrResources
  service:
    main:
      controller: main
      primary: true
      ports:
        http:
          port: 6767
  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        <<: *arrIngressAnnotations
        gethomepage.dev/name: Bazarr (Anime)
        gethomepage.dev/icon: bazarr.png
        gethomepage.dev/description: Napisy anime
        gethomepage.dev/weight: "45"
        gethomepage.dev/widget.type: bazarr
        gethomepage.dev/widget.url: http://bazarr-anime.arr-stack.svc.cluster.local:6767
        gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_BAZARR_ANIME_KEY}}" }}'
        kuma.bazarr-anime.http.name: Bazarr Anime
        kuma.bazarr-anime.http.url: https://bazarr-anime.bay.gruzin.eu
        kuma.bazarr-anime.http.accepted_statuscodes: '["200-299"]'
      hosts:
        - host: &bazarrAnimeHost bazarr-anime.bay.gruzin.eu
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: bazarr-anime-tls
          hosts:
            - *bazarrAnimeHost
  persistence:
    config:
      type: hostPath
      hostPath: /mnt/hdd/media/configs/bazarr-anime/config
      globalMounts:
        - path: /config
    data: *mediaVolume
qbittorrent:
  global:
    fullnameOverride: qbittorrent
    nameOverride: qbittorrent
  controllers:
    main:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: lscr.io/linuxserver/qbittorrent
            # 4.3.9 -> 5.2.3 also crosses libtorrent 1.x -> 2.x, so resume data is
            # rewritten on first start and torrents may recheck.
            tag: "5.2.3_v2.0.14-ls477"
            pullPolicy: Always
          env:
            <<: *arrEnv
            WEBUI_PORT: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  service:
    main:
      controller: main
      primary: true
      ports:
        http:
          port: 8080
      # Without this the Service becomes qbittorrent-main once the controller
      # owns several, breaking every in-cluster reference.
      forceRename: qbittorrent
    tcp:
      controller: main
      type: LoadBalancer
      loadBalancerIP: 192.168.0.242
      ports:
        bittorrent:
          port: 6881
          protocol: TCP
    udp:
      controller: main
      type: LoadBalancer
      loadBalancerIP: 192.168.0.241
      ports:
        bittorrent:
          port: 6881
          protocol: UDP
  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Servarr
        gethomepage.dev/name: qBittorrent
        gethomepage.dev/icon: qbittorrent.png
        gethomepage.dev/description: Torrenty
        gethomepage.dev/weight: "50"
        gethomepage.dev/widget.type: qbittorrent
        gethomepage.dev/widget.url: http://qbittorrent.arr-stack.svc.cluster.local:8080
        gethomepage.dev/widget.username: '{{ "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}" }}'
        gethomepage.dev/widget.password: '{{ "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}" }}'
        kuma.qbittorrent.http.name: qBittorrent
        kuma.qbittorrent.http.url: https://qbittorrent.gruzin.eu
        kuma.qbittorrent.http.accepted_statuscodes: '["200-299"]'
      hosts:
        - host: &qbHost qbittorrent.gruzin.eu
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: qbittorrent-tls
          hosts:
            - *qbHost
  persistence:
    config:
      type: hostPath
      hostPath: /mnt/hdd/opt/qbittorrent
      globalMounts:
        - path: /config
    data: *mediaVolume
    # Temporary alias: existing torrents record /media/downloads and would go
    # missing without it. Drop once they are re-pathed onto /data.
    legacy:
      type: hostPath
      hostPath: /mnt/hdd/media
      globalMounts:
        - path: /media

