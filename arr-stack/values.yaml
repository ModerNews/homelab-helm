# Namespace-level Vault wiring for this chart's non-OIDC secrets. `name` is what
# recyclarr's VaultStaticSecrets resolve vaultAuthRef against - VaultAuth is
# namespaced, so without this pair existing in arr-stack the secrets fail with
# `VaultAuth "arr-stack" not found` and the sync-wave -1 gate blocks the release.
#
# `role` is a dedicated Vault Kubernetes auth role bound to arr-stack/default and
# carrying the recyclarr-read policy. It is deliberately NOT `vso`: despite the
# name, vso is the OIDC reader, bound across six namespaces, and its policy grants
# only oidc/* and keycloak/admin - it cannot read these paths.
vault:
  enabled: true
  name: arr-stack
  address: http://transit-vault.transit-vault.svc.cluster.local:8200
  role: recyclarr
  serviceAccount: default

# Converge-and-exit tool, so it runs as a CronJob. Keys come from Vault and are
# referenced with !env_var, which needs each instance's API key pre-seeded.
recyclarr:
  enabled: true
  image:
    repository: ghcr.io/recyclarr/recyclarr
    tag: "8.7.2"
  schedule: "0 4 * * *"
  vault:
    mount: secret
    refreshAfter: 1h
    keys:
      SONARR_MAIN_API_KEY: sonarr/api-key
      SONARR_ANIME_API_KEY: sonarr-anime/api-key
      RADARR_MAIN_API_KEY: radarr/api-key
  # Bodies below are the TRaSH Guides root templates, inlined. Recyclarr's
  # `include:` mechanism is NOT used: as of 8.x the official config-templates
  # provider ships zero includes (`config list templates --includes` returns 0),
  # so the old v5-era include names (sonarr-v4-custom-formats-web-1080p and
  # friends) resolve against nothing and abort the whole sync. Regenerate a body
  # with `recyclarr config create -t <template>` and paste it here.
  #
  #   sonarr.main  <- web-1080p                 radarr.main <- hd-bluray-web
  #   sonarr.anime <- sonarr-anime-remux-1080p
  config:
    sonarr:
      series:
        base_url: http://sonarr.arr-stack.svc.cluster.local:8989
        api_key_env: SONARR_MAIN_API_KEY
        quality_definition:
          type: series
        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1   # WEB-1080p
            reset_unmatched_scores:
              enabled: true
        custom_format_groups:
          add:
            - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
            - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4  # [Optional] Language Profiles
            - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
            - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats

      # The guide's anime profile is Remux-first (~10-15GB/episode). The array is
      # at 78% with ~500G free, so the cutoff is pulled down to WEB 1080p - one
      # season of remux would eat most of the remaining headroom. The anime custom
      # formats and `quality_definition: anime` are kept; only the ceiling moves.
      # No custom_format_groups: the upstream template ships an empty `add:` and
      # relies on the required CFs, which recyclarr syncs automatically.
      anime:
        base_url: http://sonarr-anime.arr-stack.svc.cluster.local:8989
        api_key_env: SONARR_ANIME_API_KEY
        quality_definition:
          type: anime
        quality_profiles:
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f   # [Anime] Remux-1080p
            upgrade:
              allowed: true
              until_quality: WEB 1080p
              until_score: 10000
            reset_unmatched_scores:
              enabled: true

    radarr:
      # `quality_definition` is instance-global: it rewrites size limits for every
      # profile on this Radarr, not just the one below.
      movies:
        base_url: http://radarr.arr-stack.svc.cluster.local:7878
        api_key_env: RADARR_MAIN_API_KEY
        quality_definition:
          type: movie
        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9   # HD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
        custom_format_groups:
          add:
            - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats

jellyseerrOidc:
  enabled: true
  clientId: jellyseerr
  displayName: Jellyseerr
  keycloakCRName: keycloak
  # Rendered into the keycloak namespace: the operator resolves keycloakCRName
  # only within the client's own namespace.
  keycloakNamespace: keycloak
  realm: homelab
  # Credential source. VSO reads this KV entry and writes Secret/oidc-jellyseerr into
  # this namespace; the entry holds a single `client_secret` key.
  vault:
    address: http://transit-vault.transit-vault.svc.cluster.local:8200
    mount: secret
    path: oidc/jellyseerr
    refreshAfter: 1h
  redirectUris:
    - https://jellyseerr.gruzin.eu/login?provider=keycloak&callback=true

jellyfin:
  image:
    pullPolicy: Always

  deploymentStrategy:
    type: Recreate

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000

  # uid 1000 needs the host render group to open /dev/dri for VAAPI.
  # gid 105 is render on this Fedora node; verify with getent group render.
  podSecurityContext:
    supplementalGroups: [105]

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi

  persistence:
    config:
      enabled: true
      existingClaim: jellyfin-config
    media:
      enabled: false
    cache:
      enabled: true
      type: hostPath
      hostPath: /mnt/hdd/media/configs/jellyfin/cache

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: Jellyfin
      gethomepage.dev/group: Streaming
      gethomepage.dev/icon: jellyfin.png
      gethomepage.dev/pod-selector: app.kubernetes.io/name=jellyfin
      gethomepage.dev/weight: "10"
      gethomepage.dev/widget.type: jellyfin
      gethomepage.dev/widget.url: http://arr-stack-jellyfin.arr-stack.svc.cluster.local:8096
      gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
      gethomepage.dev/widget.version: "2"
      gethomepage.dev/widget.enableNowPlaying: "true"
      gethomepage.dev/widget.expandOneStreamToTwoRows: "false"
    hosts:
      - host: jellyfin.gruzin.eu
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: jellyfin-tls
        hosts:
          - jellyfin.gruzin.eu

  volumes:
    - name: tv
      hostPath:
        path: /mnt/hdd/media/contents/tvseries
    - name: movies
      hostPath:
        path: /mnt/hdd/media/contents/movies
    - name: anime
      hostPath:
        path: /mnt/hdd/media/contents/anime
    - name: fonts
      hostPath:
        path: /mnt/hdd/media/configs/jellyfin/fonts
    # Single-node cluster, so a hostPath device is safe. Transcoding also needs
    # HardwareAccelerationType set in encoding.xml via the Jellyfin UI.
    - name: dri
      hostPath:
        path: /dev/dri

  volumeMounts:
    - name: tv
      mountPath: /tv
    - name: movies
      mountPath: /movies
    - name: anime
      mountPath: /anime
    - name: fonts
      mountPath: /usr/local/share/fonts/custom
      readOnly: true
    - name: dri
      mountPath: /dev/dri

# Two path conventions coexist here on purpose, mid-migration.
#
#   <app>/api-key    owner-scoped: the leaf names the secret, so one path can have
#                    several readers. sonarr/sonarr-anime/radarr are read by BOTH
#                    homepage and recyclarr - storing the key twice would mean a
#                    rotation has to land in two places or silently half-break.
#   <app>/homepage   the original consumer-scoped layout, still used by the apps
#                    that have exactly one reader and so no reason to move yet.
#
# Vault's homepage-read policy globs both (`secret/data/+/homepage` and
# `secret/data/+/api-key`), so the mix is safe. Move an app to api-key whenever a
# second consumer appears; migrate the rest when convenient.
homepageSecrets:
  enabled: true
  namespace: homepage
  vaultAuthRef: homepage
  mount: secret
  refreshAfter: 1h
  apps:
    - name: homepage-jellyfin
      path: jellyfin/homepage
      env:
        HOMEPAGE_VAR_JELLYFIN_KEY: api_key
    - name: homepage-sonarr
      path: sonarr/api-key
      env:
        HOMEPAGE_VAR_SONARR_KEY: api_key
    - name: homepage-sonarr-anime
      path: sonarr-anime/api-key
      env:
        HOMEPAGE_VAR_SONARR_ANIME_KEY: api_key
    - name: homepage-radarr
      path: radarr/api-key
      env:
        HOMEPAGE_VAR_RADARR_KEY: api_key
    - name: homepage-bazarr
      path: bazarr/api-key
      env:
        HOMEPAGE_VAR_BAZARR_KEY: api_key
    - name: homepage-bazarr-anime
      path: bazarr-anime/api-key
      env:
        HOMEPAGE_VAR_BAZARR_ANIME_KEY: api_key
    - name: homepage-prowlarr
      path: prowlarr/homepage
      env:
        HOMEPAGE_VAR_PROWLARR_KEY: api_key
    - name: homepage-jellyseerr
      path: jellyseerr/homepage
      env:
        HOMEPAGE_VAR_JELLYSEERR_KEY: api_key
    - name: homepage-qbittorrent
      path: qbittorrent/homepage
      env:
        HOMEPAGE_VAR_QBITTORRENT_USERNAME: username
        HOMEPAGE_VAR_QBITTORRENT_PASSWORD: password
