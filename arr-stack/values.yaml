# YAML anchors only - resolved at parse time, not read by any subchart.
arrDefaults:
  env: &arrEnv
    PUID: "1000"
    PGID: "1000"
    TZ: Europe/Warsaw

  resources: &arrResources
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Single mount so downloads and library share a filesystem: imports become
  # atomic renames plus hardlinks instead of copies. Do not re-split per library.
  media: &mediaVolume
    type: hostPath
    hostPath: /mnt/hdd/media
    globalMounts:
      - path: /data

  ingressAnnotations: &arrIngressAnnotations
    cert-manager.io/cluster-issuer: letsencrypt
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Servarr

sonarr:
  global:
    fullnameOverride: sonarr
    nameOverride: sonarr
  controllers:
    main:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            # v2.0.0 -> v4 in one step. Back up nzbdrone.db first; if v4 refuses the
            # schema, stage through 3.0.10.1567-ls218 and retry.
            repository: lscr.io/linuxserver/sonarr
            tag: "4.0.20.3014-ls325"
            pullPolicy: Always
          env: *arrEnv
          resources: *arrResources
  service:
    main:
      controller: main
      primary: true
      ports:
        http:
          port: 8989
  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        <<: *arrIngressAnnotations
        gethomepage.dev/name: Sonarr
        gethomepage.dev/icon: sonarr.png
        gethomepage.dev/description: Seriale
        gethomepage.dev/weight: "10"
        gethomepage.dev/widget.type: sonarr
        gethomepage.dev/widget.url: http://sonarr.arr-stack.svc.cluster.local:8989
        gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_SONARR_KEY}}" }}'
        kuma.sonarr.http.name: Sonarr TV
        kuma.sonarr.http.url: https://sonarr.bay.gruzin.eu
        kuma.sonarr.http.accepted_statuscodes: '["200-299"]'
      hosts:
        - host: &sonarrHost sonarr.bay.gruzin.eu
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: sonarr-tls
          hosts:
            - *sonarrHost
  persistence:
    config:
      type: hostPath
      hostPath: /mnt/hdd/media/configs/sonarr/data
      globalMounts:
        - path: /config
    data: *mediaVolume

