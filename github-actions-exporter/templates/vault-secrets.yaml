{{- with .Values.vault }}
{{- if .enabled }}
{{- /*
Vault wiring for the rig. Same shape as homepage/templates/vault-secrets.yaml:
VaultConnection (-3) before VaultAuth (-2) before the VaultStaticSecrets (-1),
so VSO never resolves a reference to something that does not exist yet, and
every Secret exists before the exporter Deployment (wave 0) mounts it.

Both secrets have to be seeded in Vault by hand before the first sync - see
this directory's README. The `vso` role's policy must cover
secret/data/github-actions-exporter/*; if it is path-scoped rather than broad,
extend it or set vault.enabled=false and create the two Secrets with kubectl.
*/}}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  address: {{ .address | quote }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultConnectionRef: {{ .name }}
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: {{ .role | quote }}
    serviceAccount: {{ .serviceAccount | quote }}
{{- $vault := . }}
{{- range .secrets }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: {{ $vault.name }}
  type: kv-v2
  mount: {{ $vault.mount | quote }}
  path: {{ .path | quote }}
  refreshAfter: {{ $vault.refreshAfter | quote }}
  destination:
    name: {{ .name }}
    create: true
    transformation:
      excludeRaw: true
      templates:
        {{- range $key, $vaultKey := .env }}
        {{ $key }}:
          text: '{{ printf "{{ .Secrets.%s }}" $vaultKey }}'
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
