apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.upstream.port }}
      targetPort: {{ .Values.upstream.port }}
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
    kubernetes.io/service-name: {{ .Release.Name }}
addressType: IPv4
ports:
  - name: http
    port: {{ .Values.upstream.port }}
    protocol: TCP
endpoints:
  - addresses:
      - {{ .Values.upstream.address | quote }}
    conditions:
      ready: true
