image:
  repository: ghcr.io/gethomepage/homepage
  tag: v1.13.2
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 384Mi

hostPaths:
  - /mnt/hdd

ingress:
  enabled: true
  className: traefik
  host: dash.gruzin.eu
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  tls:
    enabled: true
    secretName: homepage-tls

rbac:
  traefik: true
  gateway: false

vault:
  enabled: true
  address: http://transit-vault.transit-vault.svc.cluster.local:8200
  mount: secret
  refreshAfter: 1h
  serviceAccount: default
  role: homepage
  ownSecrets:
    - name: homepage-openwrt
      path: openwrt/homepage
      env:
        HOMEPAGE_VAR_OPENWRT_USERNAME: username
        HOMEPAGE_VAR_OPENWRT_PASSWORD: password
    - name: homepage-tailscale
      path: tailscale/homepage
      env:
        HOMEPAGE_VAR_TAILSCALE_DEVICEID: deviceid
        HOMEPAGE_VAR_TAILSCALE_KEY: api_key
  envFrom:
    - homepage-openwrt
    - homepage-tailscale
    - homepage-jellyfin
    - homepage-sonarr
    - homepage-radarr
    - homepage-prowlarr
    - homepage-jellyseerr
    - homepage-qbittorrent
    - homepage-immich
    - homepage-paperless
    - homepage-argocd
    - homepage-home-assistant
    - homepage-speedtest-tracker

config:
  kubernetes:
    mode: cluster
    traefik: false
    gateway: false

  settings: |
    title: gruzin.eu
    maxGroupColumns: 3
    fullWidth: false
    useEqualHeights: true
    quicklaunch:
      searchDescriptions: true
      showSearchSuggestions: true
      hideInternetSearch: false
      hideVisitURL: false
    layout:
      System:
        style: column
      Networking:
        style: column
        Devices:
          style: row
          columns: 2
      Calendar:
        style: column
      Daily:
        style: row
        columns: 5
      Media management:
        style: row
        columns: 4
      Health:
        style: row
        columns: 4

  widgets:
    - search:
        provider:
          - google
          - duckduckgo
          - brave
          - bing
        focus: false
        showSearchSuggestions: true
        target: _self
    - datetime:
        text_size: xl
        format:
          dateStyle: short
          timeStyle: short
          hourCycle: h23
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: Cluster
        nodes:
          show: false

  services:
    - System:
        - Keycloak:
            href: https://sso.gruzin.eu
            description: Identity
            icon: keycloak.png
            weight: 20
        - Vault:
            href: https://vault.gruzin.eu
            description: Secrets
            icon: vault.png
            weight: 30
            widget:
              type: customapi
              url: http://transit-vault.transit-vault.svc.cluster.local:8200/v1/sys/health
              refreshInterval: 30000
              mappings:
                - field: sealed
                  label: Sealed
                  format: text
                  remap:
                    - value: false
                      to: "No"
                    - value: true
                      to: "Yes"
                - field: initialized
                  label: Init
                  format: text
                  remap:
                    - value: true
                      to: "Yes"
                    - any: true
                      to: "No"
                - field: version
                  label: Version
                  format: text
    - Networking:
        - Devices:
            - Router:
                href: http://192.168.0.1
                description: OpenWrt
                icon: mdi-router-network
                siteMonitor: http://192.168.0.1
                weight: 10
            - Switch:
                href: http://192.168.0.137
                description: LAN switch
                icon: mdi-switch
                siteMonitor: http://192.168.0.137
                weight: 20
        - Tailscale:
            href: https://login.tailscale.com/admin/machines
            description: Tailnet gateway
            icon: tailscale.png
            weight: 30
            widget:
              type: tailscale
              deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICEID}}"
              key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
              fields:
                [
                  "address",
                  "last_seen",
                  "expires",
                  "user",
                  "hostname",
                  "name",
                  "client_version",
                  "os",
                  "created",
                  "authorized",
                  "is_external",
                  "update_available",
                  "tags",
                ]
    - Calendar:
        - Calendar:
            icon: mdi-calendar-month
            weight: 10
            widget:
              type: calendar
              view: monthly
              maxEvents: 10
              showTime: true
              firstDayInWeek: monday
              timezone: Europe/Warsaw
    - Daily:
        - NVR:
            href: https://192.168.0.229
            description: Reolink
            icon: mdi-cctv
            siteMonitor: https://192.168.0.229
            weight: 70
    - Health:
        - CPU:
            icon: mdi-cpu-64-bit
            weight: 10
            widget:
              type: glances
              url: http://glances.glances.svc.cluster.local:61208
              version: 4
              metric: cpu
              refreshInterval: 5000
              pointsLimit: 30
        - Memory:
            icon: mdi-memory
            weight: 20
            widget:
              type: glances
              url: http://glances.glances.svc.cluster.local:61208
              version: 4
              metric: memory
              refreshInterval: 5000
              pointsLimit: 30
        - Storage:
            icon: mdi-harddisk
            weight: 40
            widget:
              type: glances
              url: http://glances.glances.svc.cluster.local:61208
              version: 4
              metric: fs:/mnt/hdd/media
              diskUnits: bbytes
              refreshInterval: 30000
        - Network:
            icon: mdi-lan
            weight: 50
            widget:
              type: glances
              url: http://glances.glances.svc.cluster.local:61208
              version: 4
              metric: network:enp0s31f6
              refreshInterval: 5000
              pointsLimit: 30

  bookmarks: []

  custom:
    css: ""
    js: ""
