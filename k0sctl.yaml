apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: homelab
spec:
  hosts:
    - role: single
      noTaints: true
      ssh:
        address: 192.168.0.253
        user: gruzin
        port: 22
        keyPath: ~/.ssh/id_ed25519
      files:
        - name: metallb-config
          src: manifests/metallb-config.yaml
          dstDir: /var/lib/k0s/manifests/metallb/
          perm: 0644
        - name: cert-manager-clusterissuer
          src: manifests/cert-manager-clusterissuer.yaml
          dstDir: /var/lib/k0s/manifests/cert-manager/
          perm: 0644
        - name: traefik-tailscale-service
          src: manifests/traefik-tailscale-service.yaml
          dstDir: /var/lib/k0s/manifests/traefik/
          perm: 0644
        - name: traefik-dashboard-cert
          src: manifests/traefik-dashboard-cert.yaml
          dstDir: /var/lib/k0s/manifests/traefik/
          perm: 0644
  k0s:
    version: 1.35.1+k0s.0
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: homelab
      spec:
        telemetry:
          enabled: false
        network:
          provider: kuberouter
          podCIDR: 10.244.0.0/16
          serviceCIDR: 10.96.0.0/12
        storage:
          type: kine
        workerProfiles:
          - name: default
            values:
              # Needed by wireguard/ (in-cluster WG forwarder pod): net.ipv4.ip_forward
              # isn't on Kubernetes' default safe-sysctls list, so the pod's
              # securityContext.sysctls request gets rejected without this.
              allowedUnsafeSysctls:
                - net.ipv4.ip_forward
        extensions:
          helm:
            repositories:
              - name: traefik
                url: https://traefik.github.io/charts
              - name: metallb
                url: https://metallb.github.io/metallb
              - name: jetstack
                url: https://charts.jetstack.io
              - name: external-dns
                url: https://kubernetes-sigs.github.io/external-dns
              - name: local-path-provisioner
                url: https://charts.containeroo.ch
              - name: tailscale
                url: https://pkgs.tailscale.com/helmcharts
            charts:
              - name: metallb
                chartname: metallb/metallb
                version: "0.14.9"
                namespace: metallb-system
                order: 1
              - name: cert-manager
                chartname: jetstack/cert-manager
                version: "v1.19.4"
                namespace: cert-manager
                order: 3
                values: |2
                  crds:
                    enabled: true
                  replicaCount: 1
                  extraArgs:
                    - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
                    - --dns01-recursive-nameservers-only=true
                  resources:
                    requests:
                      cpu: 25m
                      memory: 64Mi
                    limits:
                      cpu: 250m
                      memory: 256Mi
              - name: traefik
                chartname: traefik/traefik
                version: "41.4.0"
                namespace: traefik
                order: 4
                values: |2
                  ingressClass:
                    enabled: true
                    isDefaultClass: true
                    name: traefik
                  deployment:
                    kind: Deployment
                    replicas: 1
                  service:
                    type: LoadBalancer
                  ports:
                    web:
                      exposedPort: 80
                    websecure:
                      exposedPort: 443
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
                    limits:
                      cpu: 500m
                      memory: 256Mi
                  readinessProbe:
                    failureThreshold: 1
                    periodSeconds: 5
                  logs:
                    access:
                      enabled: false
                  ingressRoute:
                    dashboard:
                      enabled: true
                      matchRule: Host(`traefik.gruzin.eu`)
                      entryPoints:
                        - websecure
                      tls:
                        secretName: traefik-dashboard-tls
                  providers:
                    kubernetesCRD:
                      allowCrossNamespace: true
                    kubernetesGateway:
                      enabled: false
                  gateway:
                    enabled: false
                  gatewayClass:
                    enabled: false
              - name: local-path-provisioner
                chartname: local-path-provisioner/local-path-provisioner
                version: "0.0.35"
                namespace: local-path-storage
                order: 2
                values: |2
                  storageClass:
                    create: true
                    defaultClass: true
                    name: local-path
                    reclaimPolicy: Delete
              - name: tailscale-operator
                chartname: tailscale/tailscale-operator
                version: "1.90.8"
                namespace: tailscale
                order: 5
                values: |2
                  operatorConfig:
                    hostname: homelab-tailscale-operator
                  apiServerProxyConfig:
                    mode: "false"
              - name: external-dns
                chartname: external-dns/external-dns
                version: "1.20.0"
                namespace: external-dns
                order: 6
                values: |2
                  provider:
                    name: cloudflare
                  env:
                    - name: CF_API_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: cloudflare-api-token
                          key: api-token
                  domainFilters:
                    - gruzin.eu
                  extraArgs:
                    - --default-targets=100.66.99.29
                    - --force-default-targets
                  policy: sync
                  sources:
                    - ingress
                    - traefik-proxy
                  txtOwnerId: homelab
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
                    limits:
                      cpu: 100m
                      memory: 128Mi
              - name: external-dns-local
                chartname: external-dns/external-dns
                version: "1.20.0"
                namespace: external-dns
                order: 7
                values: |2
                  provider:
                    name: cloudflare
                  env:
                    - name: CF_API_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: cloudflare-api-token
                          key: api-token
                  domainFilters: []
                  extraArgs:
                    - --default-targets=192.168.0.240
                    - --force-default-targets
                    - '--regex-domain-filter=(^gruzin\.eu$|\.local\.gruzin\.eu$)'
                  policy: sync
                  sources:
                    - ingress
                  txtOwnerId: homelab-local
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
                    limits:
                      cpu: 100m
                      memory: 128Mi
