{{- with .Values.adminCredential }}
{{- if .enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: {{ printf "%s-admin" $.Values.keycloakCRName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  address: {{ .vault.address | quote }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ printf "%s-admin" $.Values.keycloakCRName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  vaultConnectionRef: {{ printf "%s-admin" $.Values.keycloakCRName }}
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso
    serviceAccount: default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ printf "%s-admin" $.Values.keycloakCRName }}
  annotations:
    # Ahead of the Keycloak CR itself: the operator needs this to reconcile any
    # client, and clients are rendered at wave -1 by the app charts.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: {{ printf "%s-admin" $.Values.keycloakCRName }}
  type: kv-v2
  mount: {{ .vault.mount | quote }}
  path: {{ .vault.path | quote }}
  refreshAfter: {{ .vault.refreshAfter | quote }}
  destination:
    name: {{ printf "%s-admin" $.Values.keycloakCRName }}
    create: true
{{- end }}
{{- end }}
