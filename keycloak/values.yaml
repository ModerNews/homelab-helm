host: sso.gruzin.eu
realm: homelab

# Name of the Keycloak CR (templates/keycloak.yaml)
keycloakCRName: keycloak

# Credential the operator authenticates to the admin API with
adminCredential:
  enabled: true
  vault:
    address: http://transit-vault.transit-vault.svc.cluster.local:8200
    mount: secret
    path: keycloak/admin
    refreshAfter: 1h

# Where the operator runs. Only used to bind it the extra in-namespace permissions
# it needs to manage an instance here - see templates/operator-rbac.yaml.
operator:
  namespace: keycloak-operator
  serviceAccount: keycloak-operator

resources:
  requests:
    cpu: 200m
    memory: 768Mi
  limits:
    memory: 1536Mi

groups:
  - argocd-admins

# The issuer clients point at is `https://{{ host }}/realms/{{ realm }}`, but it is
# NOT configurable from here - each app's chart is rendered by its own Application
# and cannot read these values, so the URL is repeated in:
#
#   ArgoCD/values.yaml     oidc.config issuer
#   paperless/values.yaml  oidc.issuerUrl
#   immich/values.yaml     immich.immich.configuration.oauth.issuerUrl
#
# Changing `host` or `realm` above means changing those three too. That duplication
# is the cost of each app owning its own client.
