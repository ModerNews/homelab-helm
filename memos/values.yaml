# Keycloak client for Memos, rendered by templates/oidc-client.yaml. Memos is not
# wired up to it yet - SSO is UI-only, see the comment in that template.
#
# This file is consumed twice: by the upstream memos chart (which ignores the `oidc`
# key) and by this repo's own chart for the client below.
oidc:
  enabled: true
  clientId: memos
  displayName: Memos
  keycloakCRName: keycloak
  # The KeycloakOIDCClient and its copy of the credential are rendered into this
  # namespace, not the app's: the operator resolves keycloakCRName only within the
  # client's own namespace. See templates/ for the full explanation.
  keycloakNamespace: keycloak
  realm: homelab
  # Credential source. VSO reads this KV entry and writes Secret/oidc-memos into
  # this namespace; the entry holds a single `client_secret` key.
  vault:
    address: http://transit-vault.transit-vault.svc.cluster.local:8200
    mount: secret
    path: oidc/memos
    refreshAfter: 1h
  redirectUris:
    - https://memos.gruzin.eu/auth/callback

persistence:
  enabled: true
  size: 5Gi
  storageClass: local-path
  accessMode: ReadWriteOnce

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Memos
    gethomepage.dev/group: Notes
    gethomepage.dev/icon: memos.png
    gethomepage.dev/description: Notatki
    gethomepage.dev/pod-selector: app.kubernetes.io/name=memos
    gethomepage.dev/weight: "40"
  hosts:
    - host: memos.gruzin.eu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: memos-tls
      hosts:
        - memos.gruzin.eu
