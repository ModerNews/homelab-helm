# Copy to mail-secret.yaml, fill in real values, and apply manually:
#   kubectl apply -n paperless -f mail-secret.yaml
# Do NOT commit the filled-in file - it is not referenced by the chart/ArgoCD,
# it just gives the IMAP credentials a stable home in the cluster to read from
# when configuring the Mail Account in the Paperless UI (Settings > Mail).
#
# `password` must be a Google App Password (Google Account > Security >
# 2-Step Verification > App passwords), not the account's login password -
# only works for personal @gmail.com accounts with 2FA enabled, not Workspace.
apiVersion: v1
kind: Secret
metadata:
  name: paperless-mail
  namespace: paperless
type: Opaque
stringData:
  address: changeme@gmail.com
  password: changeme
