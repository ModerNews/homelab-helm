# Keycloak client for Paperless, rendered by templates/oidc-client.yaml. The
# credential comes from Vault via VSO, which also renders
# PAPERLESS_SOCIALACCOUNT_PROVIDERS from it - allauth wants the whole provider config
# as one JSON string with the secret inside it.
oidc:
  enabled: true
  clientId: paperless
  displayName: Paperless-ngx
  keycloakCRName: keycloak
  # The KeycloakOIDCClient and its copy of the credential are rendered into this
  # namespace, not the app's: the operator resolves keycloakCRName only within the
  # client's own namespace. See templates/ for the full explanation.
  keycloakNamespace: keycloak
  realm: homelab
  # Credential source. VSO reads this KV entry and writes Secret/oidc-paperless into
  # this namespace; the entry holds a single `client_secret` key.
  vault:
    address: http://transit-vault.transit-vault.svc.cluster.local:8200
    mount: secret
    path: oidc/paperless
    refreshAfter: 1h
  issuerUrl: https://sso.gruzin.eu/realms/homelab
  # django-allauth's OIDC callback path is /accounts/oidc/<provider_id>/login/callback/
  # where provider_id is the "keycloak" id set in the template.
  redirectUris:
    - https://paperless.gruzin.eu/accounts/oidc/keycloak/login/callback/

paperless-ngx:
  env:
    TZ: Europe/Warsaw
    # Single hostname, so paperless derives ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS
    # and CORS_ALLOWED_HOSTS from this on its own - no overrides needed.
    PAPERLESS_URL: https://paperless.gruzin.eu
    PAPERLESS_DBENGINE: postgresql
    PAPERLESS_DBHOST:
      valueFrom:
        secretKeyRef:
          name: paperless-database-app
          key: host
    PAPERLESS_DBNAME:
      valueFrom:
        secretKeyRef:
          name: paperless-database-app
          key: dbname
    PAPERLESS_DBUSER:
      valueFrom:
        secretKeyRef:
          name: paperless-database-app
          key: user
    PAPERLESS_DBPASS:
      valueFrom:
        secretKeyRef:
          name: paperless-database-app
          key: password
    PAPERLESS_OCR_LANGUAGES: pol
    PAPERLESS_OCR_LANGUAGE: pol+eng
    PAPERLESS_OCR_CLEAN: clean-final
    PAPERLESS_REDIS: redis://paperless-redis:6379
    PAPERLESS_ADMIN_USER: admin
    PAPERLESS_ADMIN_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: paperless-admin
          key: password

    # SSO via Keycloak. django-allauth takes its whole provider config as one JSON
    # blob with the client secret embedded, so VSO renders that key straight from the
    # Vault value - see templates/oidc-client.yaml.
    # The local admin login stays enabled as a fallback if Keycloak is down.
    PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
    PAPERLESS_SOCIALACCOUNT_PROVIDERS:
      valueFrom:
        secretKeyRef:
          name: oidc-paperless
          key: PAPERLESS_SOCIALACCOUNT_PROVIDERS
    # Create a Paperless user on first Keycloak login instead of requiring one to
    # be provisioned by hand first.
    PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
    PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: https

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi

  postgresql:
    enabled: false

  redis:
    enabled: false

  persistence:
    data:
      enabled: true
      accessMode: ReadWriteOnce
      storageClass: local-path
      size: 5Gi
    media:
      enabled: true
      accessMode: ReadWriteOnce
      storageClass: local-path
      size: 10Gi
    export:
      enabled: true
      accessMode: ReadWriteOnce
      storageClass: local-path
      size: 5Gi
    consume:
      enabled: true
      accessMode: ReadWriteOnce
      storageClass: local-path
      size: 5Gi

  ingress:
    main:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Paperless
        gethomepage.dev/group: Notes
        gethomepage.dev/icon: paperless-ngx.png
        gethomepage.dev/description: Dokumenty
        gethomepage.dev/pod-selector: app.kubernetes.io/name=paperless-ngx
        gethomepage.dev/weight: "60"
      hosts:
        - host: paperless.gruzin.eu
          paths:
            - path: "/"
              service:
                identifier: main
      tls:
        - secretName: paperless-tls
          hosts:
            - paperless.gruzin.eu

homepageSecrets:
  enabled: true
  namespace: homepage
  vaultAuthRef: homepage
  mount: secret
  refreshAfter: 1h
  apps:
    - name: homepage-paperless
      path: paperless/homepage
      env:
        HOMEPAGE_VAR_PAPERLESS_KEY: token
