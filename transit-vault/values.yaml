# The cluster's only Vault. It does two jobs:
#
#   1. exposes a `transit` secrets engine that the remote (WMS-DEV) Vault points its
#      `seal "transit"` stanza at for auto-unseal - it is the root of trust for that
#      instance, which is why it is named the way it is;
#   2. stores this cluster's own secrets under `secret/`, which the Vault Secrets
#      Operator materialises into app namespaces.
#
# It is *not* auto-unsealed by anything - it holds its own Shamir key shares and must
# be unsealed manually with `vault operator unseal` after every restart. A second
# Vault auto-unsealing against this one was tried and removed: it still needed this
# instance unsealed by hand first, so it cost ~250Mi on an 8GB node to save exactly
# zero manual steps. See README.md.
#
# Note that any change below which touches the pod template forces a restart, and so
# a manual unseal afterwards. Ingress-only changes are safe.
vault:
  injector:
    enabled: false

  csi:
    enabled: false

  ui:
    enabled: true

  server:
    ha:
      enabled: false

    standalone:
      enabled: true
      # TLS is terminated at the Traefik ingress (matches the rest of this
      # cluster's ingress convention, e.g. paperless/argocd) - the listener
      # inside the pod stays plaintext, ClusterIP-only.
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "file" {
          path = "/vault/data"
        }

    dataStorage:
      enabled: true
      size: 1Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      hosts:
        - host: transit-vault.gruzin.eu
        - host: transit-vault.local.gruzin.eu
        - host: vault.gruzin.eu
        - host: vault.local.gruzin.eu
      tls:
        - secretName: transit-vault-tls
          hosts:
            - transit-vault.gruzin.eu
            - transit-vault.local.gruzin.eu
            - vault.gruzin.eu
            - vault.local.gruzin.eu

# Name of the transit key the remote Vault's seal stanza will encrypt/decrypt
# its master key with.
transitKeyName: remote-vault-unseal

# Name of the Vault policy granting the minimum rights needed for auto-unseal
# (create the key once, then encrypt/decrypt against it).
policyName: transit-unseal

initJob:
  enabled: true
  # Secret created out-of-band (see vault-root-token.example.yaml) holding the
  # root token produced by `vault operator init` on this transit Vault. The
  # job only ever uses it to bootstrap the transit engine/policy/token once.
  rootTokenSecretName: transit-vault-root-token
  # Secret this job writes the periodic unseal token into. Copy its value out
  # to the remote Vault's environment/secret store - it is never applied there
  # automatically since the remote cluster is a separate, unmanaged cluster.
  unsealTokenSecretName: transit-vault-unseal-token
  image:
    repository: hashicorp/vault
    tag: "1.21.2"
  # Periodic token TTL - the remote Vault's transit seal client renews it
  # automatically as long as it stays in continuous use.
  tokenPeriod: 768h
