apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "upsnap.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "upsnap.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "upsnap.selectorLabels" . | nindent 8 }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: upsnap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: UPSNAP_HTTP_LISTEN
              value: "0.0.0.0:{{ .Values.port }}"
            - name: UPSNAP_WEBSITE_TITLE
              value: {{ .Values.websiteTitle | quote }}
            - name: UPSNAP_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: UPSNAP_INTERVAL
              value: {{ .Values.interval | quote }}
            - name: UPSNAP_SCAN_RANGE
              value: {{ .Values.scan.range | quote }}
            - name: UPSNAP_SCAN_TIMEOUT
              value: {{ .Values.scan.timeout | quote }}
            - name: UPSNAP_PING_PRIVILEGED
              value: {{ .Values.pingPrivileged | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_RAW
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/pb_data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
