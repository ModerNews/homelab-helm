apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "upsnap.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.port }}
      protocol: TCP
  selector:
    {{- include "upsnap.selectorLabels" . | nindent 4 }}
