# VSO turns Vault KV entries into Kubernetes Secrets.
vault-secrets-operator:
  controller:
    replicas: 1

    manager:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

  # Both cluster-wide defaults are off - each app brings its own, so a shared object
  # here would only ever be an unused fallback masking a chart that forgot to declare
  # one. transit-vault is the cluster's only Vault; its address lives in each app's
  # `oidc.vault.address`.
  defaultVaultConnection:
    enabled: false

  # defaultAuthMethod would also fail on its own terms: the chart renders
  # `spec.namespace: {{ .Values.defaultAuthMethod.namespace }}` unquoted, and with no
  # Vault Enterprise namespace to set - this is Vault OSS - that becomes an explicit
  # null which the CRD rejects:
  #
  #   VaultAuth.secrets.hashicorp.com "default" is invalid: spec.namespace:
  #   Invalid value: "null": spec.namespace in body must be of type string
  #
  # Each app's own VaultAuth omits the field entirely, which is valid.
  #
  # They authenticate as their namespace's `default` ServiceAccount against the `vso`
  # Vault role, whose bound namespaces come from terraform/oidc-clients.tf.
  defaultAuthMethod:
    enabled: false
