apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-entrypoint
  labels:
    {{- include "wireguard.labels" . | nindent 4 }}
data:
  entrypoint.sh: |
    #!/bin/sh
    set -eu

    PRIVATE_KEY="$(cat /secrets/privateKey)"

    TARGET_IP=""
    for i in $(seq 1 10); do
      TARGET_IP="$(getent hosts "$FORWARD_TARGET_HOST" | awk '{print $1}' | head -n1)"
      [ -n "$TARGET_IP" ] && break
      echo "waiting for $FORWARD_TARGET_HOST to resolve..." >&2
      sleep 3
    done
    if [ -z "$TARGET_IP" ]; then
      echo "failed to resolve $FORWARD_TARGET_HOST after retries" >&2
      exit 1
    fi
    echo "forwarding to $FORWARD_TARGET_HOST -> $TARGET_IP"

    {
      echo "[Interface]"
      echo "Address = ${WG_ADDRESS}"
      echo "ListenPort = ${WG_LISTEN_PORT}"
      echo "PrivateKey = ${PRIVATE_KEY}"
      echo "MTU = ${WG_MTU}"
      echo "PostUp = sysctl -w net.ipv4.ip_forward=1"
      {{- range .Values.forward.ports }}
      echo "PostUp = iptables -t nat -A PREROUTING -i %i -p tcp --dport {{ .listen }} -j DNAT --to-destination ${TARGET_IP}:{{ .target }}"
      {{- end }}
      echo "PostUp = iptables -t nat -A POSTROUTING ! -o wg0 -j MASQUERADE"
      {{- range .Values.forward.ports }}
      echo "PreDown = iptables -t nat -D PREROUTING -i %i -p tcp --dport {{ .listen }} -j DNAT --to-destination ${TARGET_IP}:{{ .target }}"
      {{- end }}
      echo "PreDown = iptables -t nat -D POSTROUTING ! -o wg0 -j MASQUERADE"
      echo ""
      echo "[Peer]"
      echo "PublicKey = ${WG_PEER_PUBLIC_KEY}"
      echo "AllowedIPs = ${WG_PEER_ALLOWED_IPS}"
      echo "Endpoint = ${WG_PEER_ENDPOINT}"
      echo "PersistentKeepalive = ${WG_PEER_KEEPALIVE}"
    } > /etc/wireguard/wg0.conf
    chmod 600 /etc/wireguard/wg0.conf

    wg-quick up wg0

    term() {
      wg-quick down wg0
      exit 0
    }
    trap term TERM INT

    tail -f /dev/null &
    wait $!
