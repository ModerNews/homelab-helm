# NOT a live manifest - Helm never renders this (no .yaml.tpl extension logic
# applies here, but see the guard below). Shows the shape of the Secret this
# chart expects; the real one is created out-of-band, same convention as
# ArgoCD/argocd-secret.example.yaml.
#
# Create it directly on the cluster, e.g.:
#   sudo k0s kubectl create namespace wireguard
#   sudo k0s kubectl -n wireguard create secret generic wireguard-privatekey \
#     --from-literal=privateKey="$(sudo grep '^PrivateKey' /etc/wireguard/wmswg.conf | awk '{print $3}')"
{{- if false }}
apiVersion: v1
kind: Secret
metadata:
  name: wireguard-privatekey
  namespace: wireguard
type: Opaque
stringData:
  privateKey: "..."
{{- end }}
